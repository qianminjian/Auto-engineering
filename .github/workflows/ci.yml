name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-contract:
    name: Host contract (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: claude-code
            tests: >-
              tests/test_sync_agent_instructions.py
              tests/test_v8_platform.py
              tests/test_release_package.py
          - host: codex
            tests: >-
              tests/test_host_adapter.py
              tests/test_codex_hooks.py
              tests/test_codex_integration.py
              tests/test_documentation_contract.py
              tests/test_release_package.py
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --extra dev --extra otel
      - name: Check generated agent rules
        run: python3 scripts/sync_agent_instructions.py --check
      - name: Run host contract tests
        run: uv run pytest ${{ matrix.tests }} --no-cov --timeout=60 -q
      - name: Build and extract release package
        run: |
          uv run python scripts/build_release.py \
            --root . --output "${RUNNER_TEMP}/auto-engineering.tar.gz"
          mkdir -p "${RUNNER_TEMP}/auto-engineering"
          tar -xzf "${RUNNER_TEMP}/auto-engineering.tar.gz" \
            -C "${RUNNER_TEMP}/auto-engineering"
      - name: Validate installed host
        run: >-
          uv run python scripts/install_acceptance.py
          --archive "${RUNNER_TEMP}/auto-engineering.tar.gz"
          --host "${{ matrix.host }}"

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check agent instruction sync
        run: python3 scripts/sync_agent_instructions.py --check
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: "Sync deps (含 dev + otel 测试依赖)"
        run: uv sync --extra dev --extra otel
      - name: Check project metadata
        run: uv run python scripts/check_project_metadata.py
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Test + coverage gate (pytest, ≥90%)
        # design §B5.1/B13: coverage 为 remote-only gate — 环内 7 道不含 coverage
        # (16G 内存约束下 per-stage instrumentation ~2× 不可行), 由远程 CI 全量跑一次强制 ≥90%.
        run: uv run pytest tests/ --cov=auto_engineering --cov-report=term-missing --cov-fail-under=90 -q --timeout=120
