# Auto-Engineering 项目配置
# 生成: ae doctor --init-config（standard profile）
# 优先级: 环境变量 > ae.toml > 内置默认值
# key 使用 kebab-case；括号内为可覆盖它的环境变量名

[observability]
audit-log = "1"  # LLM 调用审计日志 (JSONL) (AE_AUDIT_LOG)
metrics = "1"  # AI Coding 度量与自进化体系 (AE_METRICS)
# otlp-endpoint = ""  # OTLP 分布式追踪导出 (AE_OTLP_ENDPOINT)，按需配置
token-tracking = "1"  # 逐 Tick Token JSONL 采集 (M5) (AE_TOKEN_TRACKING)
# audit-log-dir = ""  # 审计日志输出目录 (JSONL) (AE_AUDIT_LOG_DIR)，按需配置

[debugging]
debug = "0"  # 调试模式 — DebugTracer 诊断轨迹 + 详细日志 (AE_DEBUG)
log-level = "INFO"  # 日志级别 (DEBUG/INFO/WARNING/ERROR) (AE_LOG_LEVEL)

[safety]
pii-enabled = "1"  # PII 四层文件桥接防护总开关 (L1-L4) (AE_PII_ENABLED)
pii-outbound = "redact"  # L2 — outbound action JSON PII 脱敏 (AE_PII_OUTBOUND)
pii-inbound = "warn"  # L3 — inbound result JSON PII 扫描 (AE_PII_INBOUND)
pii-guardrail = "1"  # G11 PII Guardrail — 文件内容扫描 (L4) (AE_PII_GUARDRAIL)
pii-guardrail-mode = "warn"  # G11 PII Guardrail 模式 (warn/block) (AE_PII_GUARDRAIL_MODE)
production = "1"  # 生产安全模式 (AE_PRODUCTION)
strict-red = "0"  # 严格 TDD REDGuardrail — test-first 强制 (AE_STRICT_RED)
# config-policy = ""  # 非交互首次配置策略 (AE_CONFIG_POLICY)，按需配置

[performance]
max-tool-calls = "20"  # 单 Agent 最大工具调用次数 (AE_MAX_TOOL_CALLS)

[threshold]
host-budget-enforcement = "soft"  # 宿主预算执行模式 (AE_HOST_BUDGET_ENFORCEMENT)
# gate-timeout = ""  # Gate 执行超时秒数 (AE_GATE_TIMEOUT)，按需配置
max-prompt-bytes = "200000"  # 单个 Action Prompt 最大字节数 (AE_MAX_PROMPT_BYTES)
max-repair-cycles = "6"  # 单线程最大修复循环数 (AE_MAX_REPAIR_CYCLES)
max-workers-per-stage = "5"  # 单 Stage 最大 Worker 数 (AE_MAX_WORKERS_PER_STAGE)
max-workers-per-thread = "50"  # 单线程最大累计 Worker 数 (AE_MAX_WORKERS_PER_THREAD)
max-plate-audits = "3"  # 单线程最大 Plate Audit 次数 (AE_MAX_PLATE_AUDITS)
max-system-audits = "3"  # 单线程最大 System Audit 次数 (AE_MAX_SYSTEM_AUDITS)
max-worker-receipt-bytes = "4096"  # Worker Receipt 最大字节数 (AE_MAX_WORKER_RECEIPT_BYTES)
max-receipt-summary-bytes = "2048"  # Worker Receipt 摘要最大字节数 (AE_MAX_RECEIPT_SUMMARY_BYTES)
# host-max-elapsed-seconds = ""  # 单次宿主驱动最大持续秒数 (AE_HOST_MAX_ELAPSED_SECONDS)，按需配置
# host-max-cost-usd = ""  # 单次宿主驱动累计费用上限 (AE_HOST_MAX_COST_USD)，按需配置
# host-max-output-tokens = ""  # 单次宿主驱动输出 Token 上限 (AE_HOST_MAX_OUTPUT_TOKENS)，按需配置
