name: Release Plugin
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 5.0.0)"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create plugin tarball
        run: |
          python3 scripts/build_release.py \
            --root . \
            --output "release/auto-engineering-${{ inputs.version || github.ref_name }}.tar.gz"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
          generate_release_notes: true
          draft: false
