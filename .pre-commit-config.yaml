# .pre-commit-config.yaml — git commit 时自动跑检查
#
# 安装: pre-commit install (一次性)
# 手动跑全部文件: pre-commit run --all-files
#
# 设计:
#   - ruff lint + format: 每次 commit 前自动执行
#   - pytest smoke: 跑当前宿主合同与执行边界测试,无 coverage
#   - 完整门禁由 make ci 执行

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-smoke
        name: pytest smoke (host contract)
        entry: .venv/bin/pytest tests/test_action_execution_contract.py tests/test_host_supervisor.py --no-cov -q
        language: system
        pass_filenames: false
        always_run: true
