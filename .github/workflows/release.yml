name: Release Plugin
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 5.0.0)"
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev --extra otel
      - name: Full quality gate
        run: |
          uv run python scripts/sync_agent_instructions.py --check
          uv run python scripts/check_project_metadata.py
          uv run ruff check .
          uv run pytest tests/ --cov=auto_engineering --cov-report=term-missing --cov-fail-under=90 -q --timeout=120

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev --extra otel
      - name: Resolve and validate release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          PROJECT_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${VERSION}" = "${PROJECT_VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Check project metadata
        run: uv run python scripts/check_project_metadata.py
      - name: Create plugin tarball
        run: |
          python3 scripts/build_release.py \
            --root . \
            --output "release/auto-engineering-v${{ steps.version.outputs.version }}.tar.gz"
      - name: Validate Claude Code archive
        run: >-
          uv run python scripts/install_acceptance.py
          --archive "release/auto-engineering-v${{ steps.version.outputs.version }}.tar.gz"
          --host claude-code
          --wheel-cache "$(uv cache dir)"
      - name: Validate Codex archive
        run: >-
          uv run python scripts/install_acceptance.py
          --archive "release/auto-engineering-v${{ steps.version.outputs.version }}.tar.gz"
          --host codex
          --wheel-cache "$(uv cache dir)"
      - name: Create SHA-256 manifest
        run: |
          cd release
          shasum -a 256 "auto-engineering-v${{ steps.version.outputs.version }}.tar.gz" \
            > "auto-engineering-v${{ steps.version.outputs.version }}.tar.gz.sha256"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            release/*.tar.gz
            release/*.sha256
          generate_release_notes: true
          draft: false
